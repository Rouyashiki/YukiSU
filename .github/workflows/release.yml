name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Merge Manager APKs
        run: |
          set -euo pipefail
          mkdir -p Manager
          for dir in Manager-arm64-v8a; do
            if [ -d "$dir" ]; then
              gradle_dir="${dir/Manager-/Manager-gradle-}"
              gradle_apks=("$gradle_dir"/*.apk)
              if [ "${#gradle_apks[@]}" -ne 1 ] || [ ! -f "${gradle_apks[0]}" ]; then
                echo "Expected exactly one Gradle APK in $gradle_dir" >&2
                exit 1
              fi
              apk_name=$(basename "${gradle_apks[0]}")
              # Preserve the final payloads; Gradle supplies only the versioned filename.
              cp -- "$dir/app-release.apk" "Manager/$apk_name"
              if [ -f "$dir/app-release.sig" ]; then
                cp -- "$dir/app-release.sig" "Manager/${apk_name%.apk}.sig"
              fi
            fi
          done
          ls -la Manager/

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
              echo "----- Rename $dir -----"
              ksud_platform_name=$(basename "$dir")
              mv "$dir/ksud" "ksud/$ksud_platform_name"
              mv "$dir/ksud.sig" "ksud/$ksud_platform_name.sig"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "$GPG_PRIVATE_KEY" > key.asc
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import key.asc
          rm -f key.asc

      - name: Sign APKs with GPG
        run: |
          for apk in Manager/*.apk Spoofed-Manager/*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing $apk..."
              gpg --detach-sign --local-user an@anatdx.com --batch --yes --pinentry-mode loopback \
                --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
                --output "${apk}.asc" "$apk"
            fi
          done
          echo "Signatures created:"
          find . -name "*.asc" -ls

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Manager/*.apk
            Manager/*.apk.asc
            android*-lkm/*_kernelsu.ko
            android*-lkm/*_kernelsu.ko.sig
            ksud/ksud-*
