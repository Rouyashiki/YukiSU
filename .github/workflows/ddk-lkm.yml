name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      yukizygisk:
        description: 'Enable YukiZygisk kernel hooks'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-native-stub:
    if: inputs.yukizygisk
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: android-actions/setup-android@v4
      with:
        packages: ndk;30.0.16248370
    - name: Verify generated native injection images
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        python3 userspace/zygisk/inject/generate.py --ndk "$sdk_root/ndk/30.0.16248370"

  build-kernelsu-ko:
    needs: verify-native-stub
    if: ${{ !cancelled() && (needs.verify-native-stub.result == 'success' || needs.verify-native-stub.result == 'skipped') }}
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build kernelsu.ko
      run: |
        git config --global --add safe.directory /__w/YukiSU/YukiSU
        cd kernel
        test -f include/uapi/supercall.h

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="
        make_args=(CONFIG_KSU=m CONFIG_KSU_SUPERKEY=y CC=clang)
        if [ "${{ inputs.yukizygisk }}" = "true" ]; then
          make_args+=(CONFIG_KSU_YUKIZYGISK=y)
          echo "YukiZygisk kernel hooks: enabled"
        else
          echo "YukiZygisk kernel hooks: disabled"
        fi

        make clean
        make "${make_args[@]}"
        
        echo "=== Build completed ==="
        # Create output directory in GitHub workspace
        mkdir -p /github/workspace/out
        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "/github/workspace/out/$OUTPUT_NAME"
        
        echo "Copied to: /github/workspace/out/$OUTPUT_NAME"
        ls -la "/github/workspace/out/$OUTPUT_NAME"
        echo "Size: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "/github/workspace/out/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"
        
    - name: Install GPG
      if: github.event_name != 'pull_request'
      run: |
        apt-get update && apt-get install -y gnupg

    - name: Import GPG key
      if: github.event_name != 'pull_request'
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
        echo "$GPG_PRIVATE_KEY" > key.asc
        gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import key.asc
        rm -f key.asc

    - name: Sign kernelsu.ko with GPG
      if: github.event_name != 'pull_request'
      run: |
        cd /github/workspace/out
        KO_FILE="${{ inputs.kmi }}_kernelsu.ko"
        echo "Signing $KO_FILE..."
        gpg --detach-sign --local-user an@anatdx.com --batch --yes --pinentry-mode loopback \
          --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
          --output "${KO_FILE}.sig" "$KO_FILE"
        if [ -f "${KO_FILE}.sig" ]; then
          echo "Signature created successfully"
          ls -lh "${KO_FILE}.sig"
        else
          echo "Error: Signature file not created!"
          exit 1
        fi

    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.kmi }}-lkm
        path: |
          /github/workspace/out/${{ inputs.kmi }}_kernelsu.ko
          /github/workspace/out/${{ inputs.kmi }}_kernelsu.ko.sig
        if-no-files-found: ignore
