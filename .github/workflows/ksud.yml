name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Target architecture: aarch64 only"
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: true
      pack_ksuinit:
        required: false
        type: boolean
        default: true
      pack_yukizygisk:
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ANDROID_NDK_VERSION: "30.0.16248370"

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Android SDK and pinned NDK
      uses: android-actions/setup-android@v4
      with:
        packages: |
          platform-tools
          ndk;30.0.16248370

    - name: Select pinned NDK
      shell: bash
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        test -n "$sdk_root"
        ndk_root="$sdk_root/ndk/$ANDROID_NDK_VERSION"
        test -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
        echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ndk_root" >> "$GITHUB_ENV"

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        set -euo pipefail
        mkdir -p ./userspace/ksud/assets
        rm -f ./userspace/ksud/assets/*_kernelsu.ko
        # Keep this list in sync with build-lkm.yml and scripts/build.*.
        required_kmis=(
          android12-5.10
          android13-5.10
          android13-5.15
          android14-5.15
          android14-6.1
          android15-6.6
          android16-6.12
          android17-6.18
        )
        for kmi in "${required_kmis[@]}"; do
          lkm="${kmi}-lkm/${kmi}_kernelsu.ko"
          if [ ! -f "$lkm" ]; then
            echo "::error::Required LKM artifact missing: $lkm"
            exit 1
          fi
          cp "$lkm" ./userspace/ksud/assets/
        done
        echo "Embedded LKM assets:"
        ls -lh ./userspace/ksud/assets/*_kernelsu.ko
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mkdir -p ./userspace/ksud/assets
        if [ -f ksuinit-${{ inputs.target }}/ksuinit ]; then
          cp ksuinit-${{ inputs.target }}/ksuinit ./userspace/ksud/assets/
        fi

    - name: Determine target settings
      id: target
      run: |
        case "${{ inputs.target }}" in
          aarch64-linux-android|aarch64)
            echo "arch=aarch64" >> "$GITHUB_OUTPUT"
            echo "abi=arm64-v8a" >> "$GITHUB_OUTPUT"
            echo "android_target=aarch64-linux-android31" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "YukiSU supports aarch64 only, got: ${{ inputs.target }}"
            exit 1
            ;;
        esac

    - name: Prepare YukiZygisk payload
      run: |
        set -euo pipefail
        if [ "${{ inputs.pack_yukizygisk }}" != "true" ]; then
          echo "YukiZygisk payload: disabled"
          exit 0
        fi
        artifact="yukizygisk-aarch64-linux-android"
        mkdir -p ./userspace/ksud/assets
        for asset in zygiskd64 zygiskd32 \
          libzygisk64.so libzygisk32.so \
          libyukilinker64.so libyukilinker32.so \
          libyukizncore64.so libyukizncore32.so; do
          if [ ! -f "$artifact/$asset" ]; then
            echo "::error::YukiZygisk artifact missing: $artifact/$asset"
            exit 1
          fi
          cp "$artifact/$asset" ./userspace/ksud/assets/
        done

        echo "YukiZygisk payload staged into ksud/assets:"
        ls -lh ./userspace/ksud/assets/zygiskd64 \
          ./userspace/ksud/assets/zygiskd32 \
          ./userspace/ksud/assets/libzygisk64.so \
          ./userspace/ksud/assets/libzygisk32.so \
          ./userspace/ksud/assets/libyukilinker64.so \
          ./userspace/ksud/assets/libyukilinker32.so \
          ./userspace/ksud/assets/libyukizncore64.so \
          ./userspace/ksud/assets/libyukizncore32.so

    # busybox is built into ksud (ndk-busybox multi-call); no standalone busybox in assets

    # - name: Install UPX
    #   run: |
    #     UPX_VERSION="4.2.4"
    #     wget -q "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
    #     tar -xf "upx-${UPX_VERSION}-amd64_linux.tar.xz"
    #     sudo mv "upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/
    #     rm -rf "upx-${UPX_VERSION}-amd64_linux" "upx-${UPX_VERSION}-amd64_linux.tar.xz"
    #     upx --version | head -1

    - name: Build ksud
      run: |
        cd userspace/ksud
        mkdir -p build && cd build
        
        # Cross-compile using Android NDK toolchain
        TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        export CC="$TOOLCHAIN/bin/${{ steps.target.outputs.android_target }}-clang"
        export CXX="$TOOLCHAIN/bin/${{ steps.target.outputs.android_target }}-clang++"
        export AR="$TOOLCHAIN/bin/llvm-ar"
        export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
        export STRIP="$TOOLCHAIN/bin/llvm-strip"
        
        cmake .. \
          -G Ninja \
          -DCMAKE_SYSTEM_NAME=Android \
          -DCMAKE_ANDROID_ARCH_ABI="${{ steps.target.outputs.abi }}" \
          -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
          -DCMAKE_SYSTEM_VERSION=31 \
          -DCMAKE_C_COMPILER="$CC" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_BUILD_TYPE=Release \
          -DYUKISU_ENABLE_CLANG_TIDY=OFF

        ninja
        
        # Show binary info
        ls -lh ksud
        file ksud
        if [ "${{ inputs.pack_yukizygisk }}" = "true" ]; then
          echo "Embedded YukiZygisk payload assets:"
          for asset in zygiskd64 zygiskd32 \
            libzygisk64.so libzygisk32.so \
            libyukilinker64.so libyukilinker32.so \
            libyukizncore64.so libyukizncore32.so; do
            if ! grep -F "{\"$asset\"" generated/assets_data.cpp >/dev/null; then
              echo "::error::Expected embedded YukiZygisk asset missing: $asset"
              exit 1
            fi
            echo "  $asset"
          done
        fi
    - name: Import GPG key
      if: github.event_name != 'pull_request'
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
        echo "$GPG_PRIVATE_KEY" > key.asc
        gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import key.asc
        rm -f key.asc

    - name: Sign ksud with GPG
      if: github.event_name != 'pull_request'
      run: |
        cd userspace/ksud/build
        echo "Signing ksud..."
        gpg --detach-sign --local-user an@anatdx.com --batch --yes --pinentry-mode loopback \
          --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
          --output "ksud.sig" "ksud"
        if [ -f "ksud.sig" ]; then
          echo "Signature created successfully"
          ls -lh ksud.sig
        else
          echo "Error: Signature file not created!"
          exit 1
        fi

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: |
          userspace/ksud/build/ksud
          userspace/ksud/build/ksud.sig
        if-no-files-found: ignore
