name: ClangFormat check

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
      - 'userspace/**'
      - 'uapi/**'
      - 'manager/app/src/main/cpp/**'
      - 'scripts/check-format.sh'
      - '**/.clang-format'
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
      - 'userspace/**'
      - 'uapi/**'
      - 'manager/app/src/main/cpp/**'
      - 'scripts/check-format.sh'
      - '**/.clang-format'

permissions:
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install clang-format
        run: python -m pip install clang-format==22.1.8

      - name: check
        run: bash scripts/check-format.sh
