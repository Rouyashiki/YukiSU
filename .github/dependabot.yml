version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /manager
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    groups:
      maven:
        patterns:
          - "*"
